name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  sonar:
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
  security:
    uses: ./.github/workflows/snyk-semgrep.yml
    secrets: inherit
  documentation:
    uses: ./.github/workflows/generase-documentation.yml
  release:
    needs: [tests, sonar, security, documentation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-container
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish scanned image and deploy
        env:
          PREFIX: ${{ vars.AZURE_PREFIX }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          REGISTRY="${PREFIX}acr"
          IMAGE="${REGISTRY}.azurecr.io/courtflow:${GITHUB_SHA}"
          az acr login --name "$REGISTRY"
          docker load -i scanned-image.tar
          docker tag courtflow:scan "$IMAGE"
          docker tag courtflow:scan "${REGISTRY}.azurecr.io/courtflow:latest"
          docker push "$IMAGE"
          docker push "${REGISTRY}.azurecr.io/courtflow:latest"
          az webapp config container set --name "${PREFIX}-web" --resource-group "$RESOURCE_GROUP" \
            --container-image-name "$IMAGE" --container-registry-url "https://${REGISTRY}.azurecr.io" --output none
          az webapp restart --name "${PREFIX}-web" --resource-group "$RESOURCE_GROUP"
      - name: Verify published app
        env:
          PREFIX: ${{ vars.AZURE_PREFIX }}
        run: |
          URL="https://${PREFIX}-web.azurewebsites.net"
          curl --fail --retry 20 --retry-delay 15 --retry-all-errors --max-time 30 "$URL/health"
          echo "Aplicación: $URL" >> "$GITHUB_STEP_SUMMARY"
