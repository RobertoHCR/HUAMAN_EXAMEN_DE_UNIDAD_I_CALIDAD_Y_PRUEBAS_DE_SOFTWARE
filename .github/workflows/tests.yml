name: tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov=app --cov-fail-under=90 --cov-report=xml --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-and-coverage
          path: |
            reports/tests.xml
            coverage.xml
